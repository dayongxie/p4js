name: Build prebuilds

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2022
          - ubuntu-latest
          - macos-15-intel
          - macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev p7zip-full

      - name: Point Linux at the system OpenSSL
        if: runner.os == 'Linux'
        run: echo "P4SSL_ROOT=/usr" >> "$GITHUB_ENV"

      - name: Install macOS OpenSSL
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "P4SSL_ROOT=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Download the Perforce C++ API
        run: npm run setup

      - name: Build the native prebuild
        run: npm run prebuild

      # Linux debug symbols make the addon unnecessarily large. Strip only the
      # Linux ELF; keep macOS/Windows symbols untouched.
      - name: Strip Linux prebuild
        if: runner.os == 'Linux'
        run: strip --strip-unneeded prebuilds/linux-x64/p4js_native.node

      - name: Smoke-test the prebuild
        run: |
          node -e "const path=require('path');const dir=path.join('prebuilds',process.platform+'-'+process.arch);if(process.platform==='win32')process.env.PATH=path.resolve(dir)+';'+process.env.PATH;const m=require('./'+path.join(dir,'p4js_native.node'));if(!m.NativeP4)process.exit(1);console.log(m.identify())"

      - uses: actions/upload-artifact@v4
        with:
          name: p4js-prebuild-${{ runner.os }}-${{ runner.arch }}
          path: prebuilds/**
          if-no-files-found: error
          retention-days: 7
          overwrite: true
