name: Publish npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing requires Node 22.14+ / npm 11.5.1+.
          # Do NOT set registry-url: actions/setup-node then injects a
          # placeholder NODE_AUTH_TOKEN, which makes npm use token auth instead
          # of the OIDC trusted-publishing flow.
          node-version: 24
          cache: npm

      - name: Verify npm supports trusted publishing
        run: |
          echo "node $(node --version), npm $(npm --version)"
          NPM_MAJOR=$(npm --version | cut -d. -f1)
          NPM_MINOR=$(npm --version | cut -d. -f2)
          if [ "$NPM_MAJOR" -lt 11 ] || { [ "$NPM_MAJOR" -eq 11 ] && [ "$NPM_MINOR" -lt 5 ]; }; then
            echo "npm 11.5.1+ is required for trusted publishing"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Provenance requires a public source repository. Keep trusted
      # publishing (OIDC) enabled for private repositories, but skip the
      # provenance attestation until the repository is public.
      - name: Publish to npm with trusted publishing
        run: |
          if [ "${{ github.event.repository.private }}" = "true" ]; then
            npm publish --access public
          else
            npm publish --access public --provenance
          fi
