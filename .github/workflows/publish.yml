name: Publish npm (staged)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-stage-publish
  cancel-in-progress: false

jobs:
  prebuild:
    uses: ./.github/workflows/prebuild.yml

  stage:
    needs: prebuild
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing requires Node 22.14+ / npm 11.5.1+.
          # Do NOT set registry-url: actions/setup-node injects a placeholder
          # NODE_AUTH_TOKEN which would bypass the OIDC path.
          node-version: 24
          cache: npm

      - name: Verify npm supports staged publishing
        run: |
          echo "node $(node --version), npm $(npm --version)"
          NPM_MAJOR=$(npm --version | cut -d. -f1)
          NPM_MINOR=$(npm --version | cut -d. -f2)
          if [ "$NPM_MAJOR" -lt 11 ] || { [ "$NPM_MAJOR" -eq 11 ] && [ "$NPM_MINOR" -lt 5 ]; }; then
            echo "npm 11.5.1+ is required for staged publishing"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Clean prebuilds directory
        run: rm -rf prebuilds

      - uses: actions/download-artifact@v4
        with:
          pattern: p4js-prebuild-*
          path: prebuilds
          merge-multiple: true

      - name: Show staged prebuilds
        run: find prebuilds -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

      - name: Typecheck
        run: npm run typecheck

      - name: Build and validate the package
        run: |
          npm run build:js
          node scripts/check-publish.mjs

      - name: Test the Linux prebuilt addon
        run: |
          cp prebuilds/linux-x64/p4js_native.node dist/p4js_native.node
          npm run test:unit

      # The trusted publisher is configured for npm stage publish only.
      # Staging does not require 2FA; a maintainer approves the staged version
      # later in the npm UI (or with `npm stage approve <id>` + 2FA).
      - name: Stage the package on npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          case "$VERSION" in
            *-*) DIST_TAG=next ;;
            *)   DIST_TAG=latest ;;
          esac
          echo "Staging @dayongxie/p4js@$VERSION with dist-tag $DIST_TAG"
          npm stage publish --access public --tag "$DIST_TAG" | tee /tmp/npm-stage-output.txt
          {
            echo "## Staged @dayongxie/p4js@$VERSION"
            echo ""
            echo "A maintainer must approve this version in npmjs.com (package → versions → staged),"
            echo "or run \`npm stage approve <stage-id>\` locally with 2FA."
            echo ""
            echo '```'
            cat /tmp/npm-stage-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
